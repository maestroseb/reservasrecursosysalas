<style>
/* ============================================
   SISTEMA DE RESERVAS - ESTILOS LIMPIOS 🧼
   ============================================ */

/* === ESTILOS BASE === */
* { box-sizing: border-box; }
body { margin: 0; padding: 0; }

/* --- Loading Spinner --- */
#loadingSpinner {
  position: fixed;
  top: 0; left: 0; width: 100%; height: 100%;
  background-color: rgba(255, 255, 255, 0.8);
  backdrop-filter: blur(4px);
  display: none;
  justify-content: center; align-items: center;
  z-index: 9999;
}

@keyframes spin {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}

/* --- Transiciones --- */
.view-section {
  transition: opacity 0.3s ease-in-out;
}

/* === UTILIDADES SCROLLBAR (Para la lista de tramos) === */
.custom-scrollbar::-webkit-scrollbar {
  width: 6px;
}
.custom-scrollbar::-webkit-scrollbar-track {
  background: transparent;
}
.custom-scrollbar::-webkit-scrollbar-thumb {
  background-color: #e5e7eb;
  border-radius: 20px;
}
.custom-scrollbar::-webkit-scrollbar-thumb:hover {
  background-color: #d1d5db;
}

/* === COMPONENTES === */

/* --- Modales --- */
/* === TRAMOS (Estos siguen siendo útiles para estados específicos) === */
.tramo-btn-no-permitido {
  background-color: #f9fafb; /* Gray-50 */
  color: #9ca3af; /* Gray-400 */
  cursor: not-allowed;
}

.tramo-btn-reservado {
  background-color: #fff1f2; /* Rose-50 */
  color: #e11d48; /* Rose-600 */
  border-color: #fecdd3; /* Rose-200 */
  cursor: not-allowed;
}

.tramo-btn-disponible {
  background-color: white;
  /* El resto lo maneja Tailwind en el HTML */
}

/* === ANIMACIONES === */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}

/* Animación para los Toasts */
@keyframes slideIn {
  from {
    transform: translateX(100%);
    opacity: 0;
  }
  to {
    transform: translateX(0);
    opacity: 1;
  }
}

/* Overlay de carga para tarjetas */
.card-loading-overlay {
  position: absolute;
  inset: 0;
  background: rgba(255, 255, 255, 0.95);
  backdrop-filter: blur(4px);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 10;
  border-radius: 12px;
  animation: fadeInCards 0.2s ease;
}

@keyframes fadeInCards {
  from { opacity: 0; }
  to { opacity: 1; }
}

@keyframes fadeOutScale {
  from { 
    opacity: 1; 
    transform: scale(1);
  }
  to { 
    opacity: 0; 
    transform: scale(0.95);
  }
}

.removing-animation {
  animation: fadeOutScale 0.3s ease forwards;
}

/* Animación sutil para botón guardar */
@keyframes bounce-subtle {
  0%, 100% {
    transform: translateY(0);
  }
  50% {
    transform: translateY(-5px);
  }
}

/* Grid de iconos con scroll personalizado */
#iconifyGrid {
  scrollbar-width: thin;
  scrollbar-color: #cbd5e0 #f7fafc;
}

#iconifyGrid::-webkit-scrollbar {
  width: 8px;
  height: 8px;
}

#iconifyGrid::-webkit-scrollbar-track {
  background: #f7fafc;
  border-radius: 4px;
}

#iconifyGrid::-webkit-scrollbar-thumb {
  background: #cbd5e0;
  border-radius: 4px;
}

#iconifyGrid::-webkit-scrollbar-thumb:hover {
  background: #a0aec0;
}

/* Resultados de búsqueda */
#iconifySearchResults {
  scrollbar-width: thin;
  scrollbar-color: #cbd5e0 #f7fafc;
}

#iconifySearchResults::-webkit-scrollbar {
  width: 6px;
}

#iconifySearchResults::-webkit-scrollbar-track {
  background: #f7fafc;
}

#iconifySearchResults::-webkit-scrollbar-thumb {
  background: #cbd5e0;
  border-radius: 3px;
}

/* Animaciones */
@keyframes fadeIn {
  from {
    opacity: 0;
    transform: translateY(-10px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.fade-in {
  animation: fadeIn 0.3s ease-out;
}

/* Spinner */
.spinner {
  border: 3px solid #f3f3f3;
  border-top: 3px solid #3b82f6;
  border-radius: 50%;
  width: 40px;
  height: 40px;
  animation: spin 1s linear infinite;
}

@keyframes scaleIn {
  from {
    transform: scale(0.95);
    opacity: 0;
  }
  to {
    transform: scale(1);
    opacity: 1;
  }
}

/* Sub-tabs del admin */
.admin-subtab {
  padding: 0.75rem 1.5rem;
  font-size: 0.875rem;
  font-weight: 500;
  color: #6b7280;
  background-color: transparent;
  border: none;
  border-bottom: 2px solid transparent;
  cursor: pointer;
  transition: all 0.2s;
  white-space: nowrap;
}

.admin-subtab:hover {
  color: #3b82f6;
  background-color: #f3f4f6;
}

.admin-subtab.active {
  border-bottom-color: #3b82f6;
  font-weight: 600;
}

/* Secciones del admin */
.admin-section {
  display: none;
}

.admin-section.active {
  display: block;
  animation: fadeIn 0.3s ease-out;
}

/* Responsive adjustments */
@media (max-width: 640px) {
  .toast {
    right: 1rem;
    left: 1rem;
    min-width: auto;
  }

  
  #iconifyGrid {
    grid-template-columns: repeat(6, minmax(0, 1fr));
  }
}

/* Dialog (modal) personalizado */
dialog {
  border: none;
  border-radius: 0.75rem;
  padding: 0;
  box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
  max-width: 95vw;
  max-height: 90vh;
  overflow: auto;
}

dialog::backdrop {
  background-color: rgba(0, 0, 0, 0.5);
  backdrop-filter: blur(2px);
}

dialog[open] {
  animation: scaleIn 0.2s ease-out;
}

/* Tab content del panel principal */
.tab-content {
  display: none;
}

.tab-content.active {
  display: block;
  animation: fadeIn 0.3s ease-out;
}

/* Animación sutil para nueva fila */
@keyframes slideInRow {
  from {
    opacity: 0;
    transform: translateY(-10px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

/* Contenedor Centrado para Tablas Estrechas (Tramos) */
.table-container-compact {
  max-width: 800px; /* Limitamos el ancho máximo */
  margin: 0 auto;   /* Centramos el contenedor */
}

/* ========================================
   MEJORA DEL ESTILO EN EL DRAG AND DROP
   ======================================== */

/* Estilo para la fila que estamos arrastrando (semi-transparente) */
  .dragging {
    opacity: 0.4;
    background-color: #eff6ff; /* Azul muy clarito */
  }

  /* LA LÍNEA GUÍA: Borde superior grueso y azul */
  .drop-target {
    border-top: 3px solid #2563eb !important; /* Azul fuerte */
    background-color: #dbeafe !important; /* Fondo azulado */
    transition: all 0.2s ease;
  }
  
  /* Asegurar que la tabla respete los bordes al arrastrar */
  table {
    border-collapse: separate; 
    border-spacing: 0;
  }

  /* ========================================
   MEJORA DEL ESTILO DEL MENÚ ADMIN
   ======================================== */

  /* 1. SIN BORDE DE FOCO AL HACER CLIC (con teclado sí se muestra: accesibilidad) */
  button:focus:not(:focus-visible), .admin-subtab:focus:not(:focus-visible) {
    outline: none !important;
    box-shadow: none !important;
    -webkit-tap-highlight-color: transparent;
  }

  /* 2. ESTILO DE LA PESTAÑA ACTIVA (Diseño Cápsula) */
  .admin-subtab.active {
    background-color: #ffffff !important;   /* Fondo Blanco */
    color: #2563EB !important;              /* Texto Azul (blue-600) */
    box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px -1px rgba(0, 0, 0, 0.1) !important; /* Sombra */
  }
  
  /* 3. ESTILO DE LA PESTAÑA INACTIVA (color base definido arriba en .admin-subtab) */
  .admin-subtab:hover:not(.active) {
    background-color: rgba(229, 231, 235, 0.5); /* Gris clarito al pasar ratón */
    color: #374151; /* Gris más oscuro */
  }

</style>
